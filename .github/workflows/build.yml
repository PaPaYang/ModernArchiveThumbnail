name: Build Thumbnail DLL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install libarchive via vcpkg
        # 깃허브 서버에 64비트용 libarchive를 설치하고 MSBuild에 자동 연결합니다.
        run: |
          vcpkg install libarchive:x64-windows
          vcpkg integrate install

      - name: Find and Build Solution
        run: |
          $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
          if ($sln) {
              Write-Host "Solution found: $($sln.FullName)"
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64
          } else {
              Write-Error "Cannot find .sln file."
              exit 1
          }

      - name: Upload Compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-DLL
          path: |
            **/x64/Release/*.dll
            **/Release/*.dll

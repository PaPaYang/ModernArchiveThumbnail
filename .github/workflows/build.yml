YAML
name: Build Thumbnail DLL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: MSBuild 환경 설정
      uses: microsoft/setup-msbuild@v2

    - name: NuGet 환경 설정 및 패키지 복원
      # libarchive 등 외부 패키지를 사용할 경우를 대비해 빌드 전 복원 작업을 수행합니다.
      run: nuget restore

    - name: 자동 솔루션 탐색 및 프로젝트 빌드 (Release, x64)
      # PowerShell을 사용하여 파일 이름과 상관없이 최상위의 .sln 파일을 찾아 자동으로 빌드합니다.
      run: |
        $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
        if ($sln) {
            Write-Host "✅ 솔루션 파일을 찾았습니다: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64
        } else {
            Write-Error "❌ .sln 파일을 찾을 수 없습니다! 깃허브에 Visual Studio 솔루션 파일이 정상적으로 올라갔는지 확인하세요."
            exit 1
        }

    - name: 빌드된 DLL 파일 저장 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-DLL
        # x64/Release 또는 Release 폴더의 위치에 상관없이 생성된 dll을 모두 수집합니다.
        path: |
          **/x64/Release/*.dll
          **/Release/*.dll

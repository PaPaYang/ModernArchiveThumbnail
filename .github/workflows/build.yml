name: Build ModernArchiveThumbnail with vcpkg

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install NSIS
      run: choco install nsis --no-progress

    # [핵심] 빌드 직전 PowerShell을 이용해 .vcxproj 파일 내부에 ATL 설정을 강제로 주입합니다.
    - name: Patch vcxproj for ATL
      run: |
        $path = "ModernArchiveThumbnail.vcxproj"
        (Get-Content $path) -replace '<CharacterSet>Unicode</CharacterSet>', "<CharacterSet>Unicode</CharacterSet>`n    <UseOfAtl>Static</UseOfAtl>" | Set-Content $path
      shell: powershell

    - name: Build dependencies with vcpkg
      run: |
        vcpkg install libarchive[bzip2,lz4,lzma,zstd,crypto]:x64-windows
        vcpkg integrate install
      shell: cmd

    - name: Build C++ Solution
      run: msbuild ModernArchiveThumbnail.sln /p:Configuration=Release /p:Platform=x64
      shell: cmd

    - name: Gather all DLLs for NSIS
      run: |
        copy "C:\vcpkg\installed\x64-windows\bin\*.dll" .
        copy "x64\Release\ModernArchiveThumbnail.dll" .
      shell: cmd

    - name: Build Installer (EXE) with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" ModernArchiveThumbnail.nsi
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernArchiveThumbnail_Installer
        path: ModernArchiveThumbnail_Ultimate_*.exe

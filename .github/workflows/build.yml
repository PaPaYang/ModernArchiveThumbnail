name: Build ModernArchiveThumbnail with vcpkg

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install NSIS
      run: choco install nsis --no-progress

    - name: Build dependencies with vcpkg
      run: |
        vcpkg install libarchive[bzip2,lz4,lzma,zstd,crypto]:x64-windows
        vcpkg integrate install
      shell: cmd

    - name: Build C++ Solution
      run: |
        set INCLUDE=%VCToolsInstallDir%atlmfc\include;%INCLUDE%
        set LIB=%VCToolsInstallDir%atlmfc\lib\x64;%LIB%
        msbuild ModernArchiveThumbnail.sln /p:Configuration=Release /p:Platform=x64 /p:UseOfAtl=Static
      shell: cmd

    - name: Gather all DLLs for NSIS
      run: |
        copy "C:\vcpkg\installed\x64-windows\bin\*.dll" .
        copy "x64\Release\ModernArchiveThumbnail.dll" .
      shell: cmd

    - name: Build Installer (EXE) with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" ModernArchiveThumbnail.nsi
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernArchiveThumbnail_Installer
        path: ModernArchiveThumbnail_Ultimate_*.exe

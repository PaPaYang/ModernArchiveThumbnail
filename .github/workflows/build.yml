name: Build ModernArchiveThumbnail with vcpkg

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install NSIS
      run: choco install nsis --no-progress

    # [핵심] 여러 개의 DLL을 만들지 않고, 하나의 Static 라이브러리로 통합 설치
    - name: Build dependencies with vcpkg
      run: |
        vcpkg install libarchive[bzip2,lz4,lzma,zstd,crypto]:x64-windows-static
        vcpkg integrate install
      shell: cmd

    # Static 라이브러리(vcpkg)를 프로젝트에 포함시켜 컴파일하도록 설정
    - name: Build C++ Solution
      run: msbuild ModernArchiveThumbnail.sln /p:Configuration=Release /p:Platform=x64 /p:VcpkgTriplet=x64-windows-static
      shell: cmd

    # 외부 DLL이 필요 없으므로, 우리가 만든 썸네일러 DLL 딱 1개만 복사
    - name: Gather DLL for NSIS
      run: |
        copy "x64\Release\ModernArchiveThumbnail.dll" .
      shell: cmd

    - name: Build Installer (EXE) with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" ModernArchiveThumbnail.nsi
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernArchiveThumbnail_Installer
        path: ModernArchiveThumbnail_Ultimate_*.exe

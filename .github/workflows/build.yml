name: Build ModernArchiveThumbnail with vcpkg

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # [추가됨] 깃허브 서버에 누락된 Visual C++ ATL 컴포넌트를 강제로 설치합니다.
    - name: Install C++ ATL Component
      run: |
        $vsPath = (vswhere -latest -property installationPath)
        $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        Write-Host "Installing ATL into $vsPath..."
        Start-Process -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart" -Wait
      shell: powershell

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install NSIS
      run: choco install nsis --no-progress

    - name: Build dependencies with vcpkg
      run: |
        vcpkg install libarchive[bzip2,lz4,lzma,zstd,crypto]:x64-windows
        vcpkg integrate install
      shell: cmd

    - name: Build C++ Solution
      run: msbuild ModernArchiveThumbnail.sln /p:Configuration=Release /p:Platform=x64

    - name: Gather all DLLs for NSIS
      run: |
        copy "C:\vcpkg\installed\x64-windows\bin\*.dll" .
        copy "x64\Release\ModernArchiveThumbnail.dll" .
      shell: cmd

    - name: Build Installer (EXE) with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" ModernArchiveThumbnail.nsi
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernArchiveThumbnail_Installer
        path: ModernArchiveThumbnail_Ultimate_*.exe

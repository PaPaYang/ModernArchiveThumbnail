name: Build ModernArchiveThumbnail with vcpkg

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install NSIS
      run: choco install nsis --no-progress

    - name: Build dependencies with vcpkg
      run: |
        vcpkg install libarchive[bzip2,lz4,lzma,zstd,crypto]:x64-windows-static
        vcpkg integrate install
      shell: cmd

    # MSBuild 명령줄 자체에 ATL 정적 링크 옵션을 강제 주입
    - name: Build C++ Solution
      run: msbuild ModernArchiveThumbnail.sln /p:Configuration=Release /p:Platform=x64 /p:VcpkgTriplet=x64-windows-static /p:UseOfAtl=Static
      shell: cmd

    - name: Gather DLL for NSIS
      run: |
        copy "x64\Release\ModernArchiveThumbnail.dll" .
      shell: cmd

    - name: Build Installer (EXE) with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" ModernArchiveThumbnail.nsi
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernArchiveThumbnail_Installer
        path: ModernArchiveThumbnail_Ultimate_*.exe

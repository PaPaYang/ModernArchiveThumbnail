name: Build ModernArchiveThumbnail with vcpkg

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install NSIS
      run: choco install nsis --no-progress

    - name: Build dependencies with vcpkg
      run: |
        vcpkg install libarchive[bzip2,lz4,lzma,zstd,crypto]:x64-windows
        vcpkg integrate install
      shell: cmd

    # MSBuild가 절대 무시할 수 없도록 강제로 ATL 헤더 및 라이브러리 경로를 주입합니다.
    - name: Force ATL Include and Library Paths
      run: |
        $xml = @"
        <Project>
          <PropertyGroup>
            <UseOfAtl>Static</UseOfAtl>
            <IncludePath>`$(VC_ATLMFC_IncludePath);`$(IncludePath)</IncludePath>
            <LibraryPath>`$(VC_ATLMFC_LibraryPath_x64);`$(LibraryPath)</LibraryPath>
          </PropertyGroup>
        </Project>
        "@
        Set-Content -Path Directory.Build.targets -Value $xml
      shell: powershell

    - name: Build C++ Solution
      run: msbuild ModernArchiveThumbnail.sln /p:Configuration=Release /p:Platform=x64

    - name: Gather all DLLs for NSIS
      run: |
        copy "C:\vcpkg\installed\x64-windows\bin\*.dll" .
        copy "x64\Release\ModernArchiveThumbnail.dll" .
      shell: cmd

    - name: Build Installer (EXE) with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" ModernArchiveThumbnail.nsi
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModernArchiveThumbnail_Installer
        path: ModernArchiveThumbnail_Ultimate_*.exe
